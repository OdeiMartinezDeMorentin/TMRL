[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tmml"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "tminterface>=1.0.2",
    "numpy>=1.24.0",
    "gymnasium>=0.29.0",
    "pyyaml>=6.0",
    "torch>=2.0.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]