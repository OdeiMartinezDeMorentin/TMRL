environment:
  waypoints_path: "config/tracks/default/waypoints.json"
  max_steps: 3000
  failure_countdown: 200

actions:
  type: "discrete"
  steer_levels: [-1, 0, 1]

rewards:
  progress_weight: 1.0
  speed_weight: 0.1
  step_penalty: 0.001
  completion_bonus: 100.0
  no_progress_timeout: 200

state:
  look_aheads: [1, 3, 7]
  normalize_speed_max: 300.0
  normalize_rpm_max: 8000.0
  normalize_angular_max: 10.0

waypoints:
  spacing: 2.5
  smooth_window: 50
  smooth_iterations: 3